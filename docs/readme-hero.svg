      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.70"/>
      <stop offset="0.82" stop-color="#FFFFFF" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="110" y="68" width="1180" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="blurBand" x="105" y="80" width="1190" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
