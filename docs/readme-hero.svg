<svg width="1400" height="620" viewBox="0 0 1400 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QuartzNotch hero preview</title>
  <desc id="desc">A stylized macOS notch interface with Liquid Glass, media controls, calendar events, and lock screen lyrics.</desc>
  <defs>
