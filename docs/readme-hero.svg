      <stop offset="0" stop-color="#8BD9FF" stop-opacity="0.55"/>
      <stop offset="0.36" stop-color="#FF6F91" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#0B1020" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#05060A"/>
    </radialGradient>
    <linearGradient id="glass" x1="171" y1="112" x2="1229" y2="509" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.43" stop-color="#DDEBFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.21"/>
    </linearGradient>
    <linearGradient id="blackVeil" x1="700" y1="92" x2="700" y2="528" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="0.43" stop-color="#000000" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="strokeLight" x1="205" y1="515" x2="1195" y2="515" gradientUnits="userSpaceOnUse">
