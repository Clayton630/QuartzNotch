    <rect x="0" y="0" width="178" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" opacity="0.86">Live lyrics. Calendar. Timers. Media. Focus.</text>
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.58">Fast controls that stay out of the way until you need them.</text>
  </g>

